# ─────────────────────────────────────────────────────────────────────────
#  آزمون خودکار — پیشنهاد A2 (دور ۴۰)
#
#  چرا ویندوز: سه باگ اخیر **فقط روی ویندوز** ظاهر شدند و هیچ‌کدام روی
#  لینوکسِ توسعه دیده نشدند:
#    • `start.cmd` با پایان‌خط LF (cmd.exe می‌شکند)
#    • الگوی `bundle.resources` که هیچ فایلی پیدا نمی‌کرد (ساخت می‌شکند)
#    • کامنت بلوکی با دنباله‌ی «ستاره + اسلش» (SyntaxError)
#  هر سه با یک اجرای `npm test` روی windows-latest قبل از رسیدن به کاربر
#  گرفته می‌شدند.
# ─────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # ── ۱) تست کد روی لینوکس (سریع‌ترین بازخورد) ──────────────────────────
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: نصب وابستگی‌ها
        run: npm ci || npm install
      - name: بررسی نحوی (ارزان و کشنده‌ترین)
        run: npm run test:syntax
      - name: ساخت بسته‌ی API (پیش‌نیاز تست‌ها)
        run: npm run build -w @farday/api
      # ── باگ دور ۴۳: لاگ CI از بیرون خوانده نمی‌شد ──────────────────────
      # «کل تست‌ها» قرمز بود ولی هیچ‌کس نمی‌توانست بگوید **کدام** بررسی.
      # خروجی حالا در یک فایل ذخیره و به‌عنوان artifact گذاشته می‌شود، تا
      # هم این‌جا و هم بعداً قابل خواندن باشد.
      - name: کل تست‌ها
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-linux.log
      - name: ذخیره‌ی لاگ تست
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-linux
          path: /tmp/test-linux.log
          if-no-files-found: warn

  # ── ۲) تست روی ویندوز: رفتار cmd.exe و مسیرهای ویندوزی ────────────────
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # ── باگ دور ۴۳: این مرحله از دور ۴۰ تا امروز **هیچ‌وقت سبز نشد** ──
      # دلیلش خودِ چک بود، نه فایل‌ها: `grep -q $'\r'` به رفتار grep و به
      # تبدیل نقل‌قول در bash ویندوز وابسته است. جای این‌که یک ابزار را
      # حدس بزنیم، با Node می‌خوانیم — Node روی هر دو سیستم یکسان است و
      # اگر چیزی خراب بود، دقیقاً می‌گوید کدام خط.
      - name: پایان‌خط فایل‌های cmd باید CRLF باشد (باگ دور ۳۶)
        shell: bash
        run: node scripts/check-cmd-crlf.mjs
      - name: نصب وابستگی‌ها
        run: npm ci || npm install
      - name: بررسی نحوی
        run: npm run test:syntax
      - name: ساخت بسته‌ی API
        run: npm run build -w @farday/api
      - name: کل تست‌ها روی ویندوز
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-windows.log
      - name: ذخیره‌ی لاگ تست ویندوز
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows
          path: test-windows.log
          if-no-files-found: warn
      - name: اجراکننده‌های ابزار باید واقعاً بالا بیایند
        run: npm run test:tool-runners

  # ── ۳) آمادگی انتشار (فقط روی PR) ─────────────────────────────────────
  release-readiness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run build -w @farday/api
      - name: بررسی آمادگی انتشار
        run: npm run release:check
