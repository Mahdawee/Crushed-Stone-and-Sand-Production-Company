[package]
name = "farday-roshan"
version = "0.1.0"
description = "سیستم مدیریت شرکت تولیدی فردای روشن — سنگ، کرش، جغل و ریگ"
authors = ["Farday Roshan"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "farday-roshan"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
